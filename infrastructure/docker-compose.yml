services:
  postgres:
    image: postgres:16-alpine
    container_name: jobfinder-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  redis:
    image: redis:7-alpine
    container_name: jobfinder-redis
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: jobfinder-rabbitmq
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: jobfinder-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks:
      - jobfinder-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: jobfinder-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: jobfinder-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: jobfinder
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8089:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - jobfinder-net

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: jobfinder-minio
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: jobfinder-meilisearch
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - jobfinder-net

  api-gateway:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/api-gateway:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-api-gateway
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${API_GATEWAY_PORT:-8080}
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - jobfinder-net

  user-service:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/user-service:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-user-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${USER_SERVICE_PORT:-8081}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - jobfinder-net

  resume-service:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/resume-service:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-resume-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${RESUME_SERVICE_PORT:-8082}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jobfinder-net

  resume-parser:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/resume-parser:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-resume-parser
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${RESUME_PARSER_PORT:-8083}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      resume-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8083/health', timeout=2).status == 200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jobfinder-net

  job-scraper:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/job-scraper:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-job-scraper
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${JOB_SCRAPER_PORT:-8084}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jobfinder-net

  job-processor:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/job-processor:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-job-processor
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${JOB_PROCESSOR_PORT:-8085}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jobfinder-net

  job-matcher:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/job-matcher:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-job-matcher
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${JOB_MATCHER_PORT:-8086}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jobfinder-net

  recommendation-service:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/recommendation-service:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-recommendation-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${RECOMMENDATION_SERVICE_PORT:-8087}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jobfinder-net

  scheduler:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/scheduler:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-scheduler
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${SCHEDULER_PORT:-8088}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      job-scraper:
        condition: service_healthy
      job-matcher:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jobfinder-net

  outbox-relay:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/outbox-relay:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-outbox-relay
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${OUTBOX_RELAY_PORT:-8091}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jobfinder-net

  feature-aggregator:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/feature-aggregator:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-feature-aggregator
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${FEATURE_AGGREGATOR_PORT:-8092}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jobfinder-net

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-shardendumishra22}/frontend:${IMAGE_TAG:-v2}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: jobfinder-frontend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - jobfinder-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  zookeeper_data:
  kafka_data:
  minio_data:
  meili_data:

networks:
  jobfinder-net:
    name: jobfinder-net
