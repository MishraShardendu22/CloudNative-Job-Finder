services:
  postgres:
    image: postgres:16-alpine
    container_name: jobfinder-postgres
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  redis:
    image: redis:7-alpine
    container_name: jobfinder-redis
    env_file:
      - ../.env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: jobfinder-rabbitmq
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: jobfinder-minio
    env_file:
      - ../.env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: jobfinder-meilisearch
    env_file:
      - ../.env
    volumes:
      - meili_data:/meili_data
    networks:
      - jobfinder-net

  api-gateway:
    image: shardendumishra22/api-gateway
    container_name: jobfinder-api-gateway
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_started
      resume-service:
        condition: service_started
      recommendation-service:
        condition: service_started
    networks:
      - jobfinder-net

  user-service:
    image: shardendumishra22/user-service
    container_name: jobfinder-user-service
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobfinder-net

  resume-service:
    image: shardendumishra22/resume-service
    container_name: jobfinder-resume-service
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - jobfinder-net

  resume-parser:
    image: shardendumishra22/resume-parser
    container_name: jobfinder-resume-parser
    env_file:
      - ../.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      resume-service:
        condition: service_started
    networks:
      - jobfinder-net

  job-scraper:
    image: shardendumishra22/job-scraper
    container_name: jobfinder-job-scraper
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - jobfinder-net

  job-processor:
    image: shardendumishra22/job-processor
    container_name: jobfinder-job-processor
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - jobfinder-net

  job-matcher:
    image: shardendumishra22/job-matcher
    container_name: jobfinder-job-matcher
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - jobfinder-net

  recommendation-service:
    image: shardendumishra22/recommendation-service
    container_name: jobfinder-recommendation-service
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobfinder-net

  scheduler:
    image: shardendumishra22/scheduler
    container_name: jobfinder-scheduler
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      job-scraper:
        condition: service_started
      job-matcher:
        condition: service_started
    networks:
      - jobfinder-net

  frontend:
    image: shardendumishra22/frontend
    container_name: jobfinder-frontend
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - jobfinder-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meili_data:

networks:
  jobfinder-net:
    name: jobfinder-net
