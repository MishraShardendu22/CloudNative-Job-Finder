services:
  postgres:
    image: postgres:16-alpine
    container_name: jobfinder-postgres
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  redis:
    image: redis:7-alpine
    container_name: jobfinder-redis
    env_file:
      - ../.env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: jobfinder-rabbitmq
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: jobfinder-zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - jobfinder-net

  kafka:
    image: bitnami/kafka:3.7
    container_name: jobfinder-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: jobfinder-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: jobfinder
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8089:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - jobfinder-net

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: jobfinder-minio
    env_file:
      - ../.env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobfinder-net

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: jobfinder-meilisearch
    env_file:
      - ../.env
    volumes:
      - meili_data:/meili_data
    networks:
      - jobfinder-net

  api-gateway:
    image: shardendumishra22/api-gateway
    container_name: jobfinder-api-gateway
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_started
      resume-service:
        condition: service_started
      recommendation-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - jobfinder-net

  user-service:
    image: shardendumishra22/user-service
    container_name: jobfinder-user-service
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobfinder-net

  resume-service:
    image: shardendumishra22/resume-service
    container_name: jobfinder-resume-service
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - jobfinder-net

  resume-parser:
    image: shardendumishra22/resume-parser
    container_name: jobfinder-resume-parser
    env_file:
      - ../.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      resume-service:
        condition: service_started
    networks:
      - jobfinder-net

  job-scraper:
    image: shardendumishra22/job-scraper
    container_name: jobfinder-job-scraper
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - jobfinder-net

  job-processor:
    image: shardendumishra22/job-processor
    container_name: jobfinder-job-processor
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - jobfinder-net

  job-matcher:
    image: shardendumishra22/job-matcher
    container_name: jobfinder-job-matcher
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - jobfinder-net

  recommendation-service:
    image: shardendumishra22/recommendation-service
    container_name: jobfinder-recommendation-service
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobfinder-net

  scheduler:
    image: shardendumishra22/scheduler
    container_name: jobfinder-scheduler
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      job-scraper:
        condition: service_started
      job-matcher:
        condition: service_started
    networks:
      - jobfinder-net

  outbox-relay:
    build:
      context: ..
      dockerfile: services/outbox-relay/Dockerfile
    image: shardendumishra22/outbox-relay
    container_name: jobfinder-outbox-relay
    env_file:
      - ../.env
    environment:
      PORT: ${OUTBOX_RELAY_PORT:-8091}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - jobfinder-net

  feature-aggregator:
    build:
      context: ..
      dockerfile: services/feature-aggregator/Dockerfile
    image: shardendumishra22/feature-aggregator
    container_name: jobfinder-feature-aggregator
    env_file:
      - ../.env
    environment:
      PORT: ${FEATURE_AGGREGATOR_PORT:-8092}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - jobfinder-net

  frontend:
    image: shardendumishra22/frontend
    container_name: jobfinder-frontend
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - jobfinder-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meili_data:

networks:
  jobfinder-net:
    name: jobfinder-net
